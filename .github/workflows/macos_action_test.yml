name: Action test on MacOS

on:
  schedule:
    - cron: "0 4 * * MON-FRI" # Runs at 04:00 UTC
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-minimal:
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2.3.4
      - run: date > reports/macos_report_minimal.txt
      - uses: GuillaumeFalourd/git-commit-push@954983f1f22b9695ffee7d2456c00d100763ada6 # main

  macos-full:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2.3.4
      - run: date > reports/macos_report_full.txt
      - uses: GuillaumeFalourd/git-commit-push@954983f1f22b9695ffee7d2456c00d100763ada6 # main
        with:
          email: ${{ github.actor }}[bot]@users.noreply.github.com
          name: ${{ github.actor }}
          commit_message: macos full workflow
          target_branch: macos
          files: reports/macos_report_full.txt
          remote_repository: origin
          access_token: ${{ github.token }}
          force: true
          empty: true
          tags: true

  macos-nochanges:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2.3.4
      - uses: GuillaumeFalourd/git-commit-push@954983f1f22b9695ffee7d2456c00d100763ada6 # main
