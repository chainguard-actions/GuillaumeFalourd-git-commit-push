name: Test invalid remote repository URL

on:
  workflow_dispatch:

jobs:
  test-invalid-remote-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          email: "test@example.com"
          name: "Test User"
          commit_message: "Test commit"
          target_branch: "act-harness"
          files: "."
          remote_repository: "not-a-valid-url"
          access_token: ${{ github.token }}
          force: "0"
          empty: "0"
        continue-on-error: true

      - name: Assert action failed with invalid URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid remote URL, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid remote URL"
