name: Test commit and push with changes

on:
  workflow_dispatch:

jobs:
  test-with-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up local bare repo as origin (avoid pushing to GitHub)
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a new file to commit
        run: |
          echo "test content $(date)" > "$GITHUB_WORKSPACE/test-commit-file.txt"

      - id: action
        uses: .
        with:
          email: "test@example.com"
          name: "Test User"
          commit_message: "Test commit from act workflow"
          target_branch: "act-harness"
          files: "test-commit-file.txt"
          remote_repository: "origin"
          access_token: ${{ github.token }}
          force: "0"
          empty: "0"

      - name: Assert file was committed and pushed
        run: |
          # Verify the commit was made by checking git log
          LAST_MSG=$(git log -1 --pretty=%s)
          echo "Last commit message: $LAST_MSG"
          if [ "$LAST_MSG" != "Test commit from act workflow" ]; then
            echo "FAIL: expected last commit message to be 'Test commit from act workflow', got: $LAST_MSG"
            exit 1
          fi
          echo "PASS: commit was made with correct message"

      - name: Assert file was pushed to local remote
        run: |
          # Verify the commit exists in the local bare remote
          REMOTE_LOG=$(git log origin/act-harness -1 --pretty=%s 2>/dev/null || echo "")
          echo "Remote last commit: $REMOTE_LOG"
          if [ "$REMOTE_LOG" != "Test commit from act workflow" ]; then
            echo "FAIL: expected remote to have commit 'Test commit from act workflow', got: $REMOTE_LOG"
            exit 1
          fi
          echo "PASS: commit was pushed to remote"
