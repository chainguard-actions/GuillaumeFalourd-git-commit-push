name: 'Git Commit Push Action'
description: 'GitHub Action to commit & push changes made in workflows (all os supported).'
inputs:
  email:
    description: Committer's email address
    required: true
    default: ${{ github.actor }}@users.noreply.github.com
  name:
    description: Committer's username
    required: true
    default: ${{ github.actor }}
  commit_message:
    description: Commit message
    required: true
    default: Commit performed using Push and Commit action
  target_branch:
    description: Branch to push the changes back to
    required: true
    default: ${{ github.ref }}
  files:
    description: Files to add separated by space
    required: true
    default: .
  remote_repository:
    description: Repository url to push the code to
    required: true
    default: origin
  access_token:
    description: Token used to push the code
    required: true
    default: ${{ github.token }}
  force:
    description: Whether to perform force push
    required: true
    default: '0'
  empty:
    description: Whether to allow empty commit
    required: false
    default: '0'
  tags:
    description: Whether to use --tags
    required: false
    default: '0'
outputs:
  diff-output:
    description: "Assert output"
    value: ${{ steps.assert.outputs.result }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Git push and commit origin
      if: ${{ inputs.remote_repository == 'origin' }}
      env:
        INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_EMPTY: ${{ inputs.empty }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REMOTE_REPOSITORY: ${{ inputs.remote_repository }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_JOB: ${{ github.job }}
      run: "CURRENT_BRANCH=${GITHUB_REF}\ncase \"$CURRENT_BRANCH\" in \"refs/heads/\"*)\n    CURRENT_BRANCH=$(echo \"$CURRENT_BRANCH\" | sed \"s@refs/heads/@@\")\nesac\nTARGET_BRANCH=\"$INPUT_TARGET_BRANCH\"\ncase \"$TARGET_BRANCH\" in \"refs/heads/\"*)\n    TARGET_BRANCH=$(echo \"$TARGET_BRANCH\" | sed \"s@refs/heads/@@\")\nesac\n\nif [ \"$INPUT_FORCE\" != \"0\" ]; then\n    FORCE='--force'\nfi\nif [ \"$INPUT_EMPTY\" != \"0\" ]; then\n    EMPTY='--allow-empty'\nfi\nif [ \"$INPUT_TAGS\" != \"0\" ]; then\n    TAGS='--tags'\nfi\n\necho \"machine github.com\" > \"$HOME/.netrc\"\necho \"  login $GITHUB_ACTOR\" >> \"$HOME/.netrc\"\necho \"  password $INPUT_ACCESS_TOKEN\" >> \"$HOME/.netrc\"\n\necho \"machine api.github.com\" >> \"$HOME/.netrc\"\necho \"  login $GITHUB_ACTOR\" >> \"$HOME/.netrc\"\necho \"  password $INPUT_ACCESS_TOKEN\" >> \"$HOME/.netrc\"\n\ngit config --local user.email \"$INPUT_EMAIL\"\ngit config --local user.name \"$INPUT_NAME\"\n\nif [[ `git status --porcelain` ]]; then\n  read -ra FILES_ARRAY <<< \"$INPUT_FILES\"\n  git add \"${FILES_ARRAY[@]}\" -v\n  git commit -m \"$INPUT_COMMIT_MESSAGE\" $EMPTY\n  git branch \"git-commit-push-action-${GH_RUN_ID}-${GH_JOB}\"\n  git fetch \"$INPUT_REMOTE_REPOSITORY\" \"$CURRENT_BRANCH\"\n  git checkout \"$CURRENT_BRANCH\"\n  git merge \"git-commit-push-action-${GH_RUN_ID}-${GH_JOB}\"\n  git branch -d \"git-commit-push-action-${GH_RUN_ID}-${GH_JOB}\"\n\n  git push \"$INPUT_REMOTE_REPOSITORY\" \"$CURRENT_BRANCH:$TARGET_BRANCH\" --follow-tags $FORCE $TAGS        \nelse\n  echo \"WARNING: No changes were detected. git commit push action aborted.\"\nfi\n"
      shell: bash
    - name: Git push and commit remote
      if: ${{ inputs.remote_repository != 'origin' }}
      env:
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_REMOTE_REPOSITORY: ${{ inputs.remote_repository }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_JOB: ${{ github.job }}
      run: |
        if [ -z "$INPUT_ACCESS_TOKEN" ]; then
          echo "WARNING: The access_token input is mandatory to push files to another repository."
          exit 1
        fi

        REGEX="^(https|git)(:\\/\\/|@)([^\\/:]+)[\\/:]([^\\/:]+)\\/(.+)$"

        if [[ "$INPUT_REMOTE_REPOSITORY" =~ $REGEX ]]; then
            PROTOCOL=${BASH_REMATCH[1]}
            SEPARATOR=${BASH_REMATCH[2]}
            HOSTNAME=${BASH_REMATCH[3]}
            DESTINATION_OWNER=${BASH_REMATCH[4]}
            DESTINATION_REPOSITORY=${BASH_REMATCH[5]}
            if [[ $DESTINATION_REPOSITORY == *'.git'* ]] && [[ $DESTINATION_REPOSITORY != *'.github.io'* ]]; then
              DESTINATION_REPOSITORY=${DESTINATION_REPOSITORY//.git/ }
            fi

            CLONE_DIRECTORY=$(mktemp -d)

            echo "##### Cloning destination Github repository #####"
            # Setup git
            git config --global user.email "$INPUT_EMAIL"
            git config --global user.name "$INPUT_NAME"
            git config -l | grep 'http\..*\.extraheader' | cut -d= -f1 | xargs -L1 git config --unset-all
            git clone "https://$INPUT_ACCESS_TOKEN@github.com/$DESTINATION_OWNER/$DESTINATION_REPOSITORY.git" "$CLONE_DIRECTORY"

            echo
            echo "##### Copying contents to remote Github repository #####"
            echo ""##### Current repo content #####"
            ls -lha
            read -ra FILES_ARRAY <<< "$INPUT_FILES"
            cp -rvf "${FILES_ARRAY[@]}" "$CLONE_DIRECTORY"

            cd "$CLONE_DIRECTORY"
            echo ""##### Remote repo content after copying files #####"
            ls -la "$CLONE_DIRECTORY"

            REMOTE_URL="https://$DESTINATION_OWNER:$INPUT_ACCESS_TOKEN@github.com/$DESTINATION_OWNER/$DESTINATION_REPOSITORY"
            git remote set-url origin "$REMOTE_URL"
            git fetch origin

            git add --all

            # Won't commit if no changes were made
            git diff-index --quiet HEAD || git commit --message "$INPUT_COMMIT_MESSAGE"
            git status
            git branch "git-commit-push-action-${GH_RUN_ID}-${GH_JOB}"

            # Create new branch (if necessary)
            BE=$(git ls-remote --heads origin "$INPUT_TARGET_BRANCH" | wc -l)
            if [[ $BE == *"0"* ]]; then
              echo "##### Target branch doesn't exist. Creating new branch #####"
              git checkout -b "$INPUT_TARGET_BRANCH"
            else
              git checkout "$INPUT_TARGET_BRANCH"
            fi
            git merge -X theirs "git-commit-push-action-${GH_RUN_ID}-${GH_JOB}"
            git branch -d "git-commit-push-action-${GH_RUN_ID}-${GH_JOB}"

            echo
            echo "##### Pushing git commit #####"
            git push -f -u origin "$INPUT_TARGET_BRANCH"

        else
          echo
          echo "WARNING: Couldn't read remote_repository URL input."
          echo "ACCEPTED FORMAT:"
          echo "git://github.com/<owner>/<repo>.git"
          echo "or"
          echo "git@github.com:<owner>/<repo>.git"
          echo "or"
          echo "https://github.com/<owner>/<repo>.git"
          echo "or"
          echo "https://github.com/<owner>/<repo>"
          exit 1
        fi
      shell: bash
branding:
  icon: 'git-commit'
  color: 'black'
