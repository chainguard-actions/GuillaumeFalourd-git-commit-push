name: Test invalid remote repository URL
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity and set up local branch
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          # Ensure act-harness branch exists locally (act runs in detached HEAD)
          git checkout -B act-harness

      - id: action
        uses: .
        with:
          email: test@example.com
          name: Test User
          commit_message: "Test commit"
          target_branch: act-harness
          files: "."
          remote_repository: "not-a-valid-url"
          access_token: fake-token
          force: "0"
          empty: "0"
        continue-on-error: true

      - name: Assert action failed with invalid URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid remote_repository URL, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid remote_repository URL"
