name: Test custom committer name and email

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local bare repo as remote
        run: |
          # Create a bare repo to act as the remote
          git init --bare /tmp/remote-repo.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/remote-repo.git
          # Push current state to the bare repo so it has the branch
          git push origin act-harness

      - name: Create a file change to commit
        run: |
          echo "custom-committer-test-$(date +%s)" > tests/test-committer-artifact.txt

      - id: action
        uses: .
        with:
          email: custom-user@custom-domain.com
          name: Custom Committer Name
          commit_message: "Custom committer test"
          target_branch: act-harness
          files: tests/test-committer-artifact.txt
          remote_repository: origin
          access_token: fake-token
          force: "0"
          empty: "0"

      - name: Assert commit author email
        run: |
          AUTHOR_EMAIL=$(git log -1 --pretty=%ae)
          echo "Author email: $AUTHOR_EMAIL"
          if [ "$AUTHOR_EMAIL" != "custom-user@custom-domain.com" ]; then
            echo "FAIL: expected author email 'custom-user@custom-domain.com' but got '$AUTHOR_EMAIL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert commit author name
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=%an)
          echo "Author name: $AUTHOR_NAME"
          if [ "$AUTHOR_NAME" != "Custom Committer Name" ]; then
            echo "FAIL: expected author name 'Custom Committer Name' but got '$AUTHOR_NAME'"
            exit 1
          fi
          echo "PASS"
