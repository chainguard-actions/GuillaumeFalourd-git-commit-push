name: Test no changes scenario

on:
  workflow_dispatch:

jobs:
  test-no-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up local bare repo as origin (avoid pushing to GitHub)
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Ensure working tree is clean
        run: |
          git status --porcelain
          # Make sure there are no uncommitted changes
          git checkout -- . 2>/dev/null || true

      - id: action
        uses: .
        with:
          email: "test@example.com"
          name: "Test User"
          commit_message: "Test commit"
          target_branch: "act-harness"
          files: "."
          remote_repository: "origin"
          access_token: ${{ github.token }}
          force: "0"
          empty: "0"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (no changes to commit)"
          echo "PASS"
