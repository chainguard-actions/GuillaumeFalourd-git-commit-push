name: 'Git Commit Push Action'
description: 'GitHub Action to commit & push changes made in workflows (all os supported).'
inputs:
  email:
    description: Committer's email address
    required: true
    default: ${{ github.actor }}@users.noreply.github.com
  name:
    description: Committer's username
    required: true
    default: ${{ github.actor }}
  commit_message:
    description: Commit message
    required: true
    default: Commit performed using Push and Commit action
  target_branch:
    description: Branch to push the changes back to
    required: true
    default: ${{ github.ref }}
  files:
    description: Files to add separated by space
    required: true
    default: .
  remote_repository:
    description: Repository url to push the code to
    required: true
    default: origin
  access_token:
    description: Token used to push the code
    required: true
    default: ${{ github.token }}
  force:
    description: Whether to perform force push
    required: true
    default: '0'
  empty:
    description: Whether to allow empty commit
    required: false
    default: '0'
  tags:
    description: Whether to use --tags
    required: false
    default: '0'
outputs:
  diff-output:
    description: "Assert output"
    value: ${{ steps.assert.outputs.result }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Git push and commit
      env:
        INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_EMPTY: ${{ inputs.empty }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REMOTE_REPOSITORY: ${{ inputs.remote_repository }}
        GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        GITHUB_JOB_VAL: ${{ github.job }}
      run: |
        CURRENT_BRANCH=${GITHUB_REF}
        case "$CURRENT_BRANCH" in "refs/heads/"*)
            CURRENT_BRANCH=$(echo "$CURRENT_BRANCH" | sed "s@refs/heads/@@")
        esac
        TARGET_BRANCH="$INPUT_TARGET_BRANCH"
        case "$TARGET_BRANCH" in "refs/heads/"*)
            TARGET_BRANCH=$(echo "$TARGET_BRANCH" | sed "s@refs/heads/@@")
        esac

        if [ "$INPUT_FORCE" != "0" ]; then
            FORCE='--force'
        fi
        if [ "$INPUT_EMPTY" != "0" ]; then
            EMPTY='--allow-empty'
        fi
        if [ "$INPUT_TAGS" != "0" ]; then
            TAGS='--tags'
        fi

        echo "machine github.com" > "$HOME/.netrc"
        echo "  login $GITHUB_ACTOR" >> "$HOME/.netrc"
        echo "  password $INPUT_ACCESS_TOKEN" >> "$HOME/.netrc"

        echo "machine api.github.com" >> "$HOME/.netrc"
        echo "  login $GITHUB_ACTOR" >> "$HOME/.netrc"
        echo "  password $INPUT_ACCESS_TOKEN" >> "$HOME/.netrc"

        git config --local user.email "$INPUT_EMAIL"
        git config --local user.name "$INPUT_NAME"
        read -ra FILES_ARRAY <<< "$INPUT_FILES"
        git add "${FILES_ARRAY[@]}" -v
        git commit -m "$INPUT_COMMIT_MESSAGE" $EMPTY

        BRANCH_NAME="push-and-commit-action-${GITHUB_RUN_ID_VAL}-${GITHUB_JOB_VAL}"
        git branch "$BRANCH_NAME"
        git fetch "$INPUT_REMOTE_REPOSITORY" "$CURRENT_BRANCH"
        git checkout "$CURRENT_BRANCH"
        git merge "$BRANCH_NAME"
        git branch -d "$BRANCH_NAME"

        git push "$INPUT_REMOTE_REPOSITORY" "$CURRENT_BRANCH:$TARGET_BRANCH" --follow-tags $FORCE $TAGS
      shell: bash
branding:
  icon: 'git-commit'
  color: 'black'
